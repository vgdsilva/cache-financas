name: cache-financas

services:
  postgres:
    image: postgres:17-alpine
    container_name: cache-financas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cachefinancas}
      POSTGRES_USER: ${POSTGRES_USER:-cachefinancas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no deploy/.env}
    # Sem "ports": acessivel somente pelo server, na rede do compose.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Aplica migrations e seeds e encerra. O server so sobe depois que termina com sucesso.
  migration:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.migration
    image: cache-financas-migration:latest
    container_name: cache-financas-migration
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-cachefinancas};Username=${POSTGRES_USER:-cachefinancas};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: cache-financas-server:latest
    container_name: cache-financas-server
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-cachefinancas};Username=${POSTGRES_USER:-cachefinancas};Password=${POSTGRES_PASSWORD}
    # Sem "ports": so o web enxerga o server.
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3333/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: cache-financas-web:latest
    container_name: cache-financas-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    # Sem depends_on: se o server cair ou falhar no deploy, o web continua no ar.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
