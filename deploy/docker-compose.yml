name: cache-financas

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: cache-financas-server:latest
    container_name: cache-financas-server
    restart: unless-stopped
    env_file: .env
    # Sem "ports": so o web (rede default) e o banco (db-net) enxergam o server.
    networks:
      - default
      - db-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3333/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: cache-financas-web:latest
    container_name: cache-financas-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # /api/* e repassado ao server pelo rewrite do Next
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  # Criada uma vez no servidor junto com o Postgres (ver deploy/postgres)
  db-net:
    external: true
    name: db-net
