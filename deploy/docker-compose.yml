name: cache-financas

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cache-financas-web:latest
    container_name: cache-financas-web
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - dataprotection-keys:/keys
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  dataprotection-keys:

networks:
  # Criada uma vez no servidor junto com o Postgres (ver deploy/postgres)
  db-net:
    external: true
    name: db-net
