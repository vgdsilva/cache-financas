server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck do proprio web (independe da API)
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # /api/* -> API (prefixo removido: /api/health -> api:3333/health).
    # Resolver dinamico: o nginx sobe mesmo que a API esteja fora do ar.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://server:3333;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Assets versionados do Blazor
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fallback do SPA
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
