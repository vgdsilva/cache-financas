# Postgres standalone do servidor. NAO e executado pelo pipeline.
# Subir uma vez:  docker network create db-net
#                 cp .env.example .env && editar && docker compose up -d
name: postgres

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    # Sem "ports": acessivel somente pela rede db-net.
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  db-net:
    external: true
    name: db-net
